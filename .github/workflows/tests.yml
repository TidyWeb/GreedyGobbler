name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF and OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr fonts-dejavu-core
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Populate exact tokenizer cache for tests
        env:
          TIKTOKEN_CACHE_DIR: .test-artifacts/tokenizers
        run: |
          mkdir -p "$TIKTOKEN_CACHE_DIR"
          python -c "import tiktoken; tiktoken.get_encoding('cl100k_base'); tiktoken.get_encoding('o200k_base')"
      - name: Run Python suite
        env:
          TIKTOKEN_CACHE_DIR: .test-artifacts/tokenizers
        run: python -m unittest discover -s tests -v
      - name: Run JavaScript checks
        run: |
          node --test tests/test_ui.cjs
          node --check static/app.js
      - name: Compile Python sources
        run: python -m compileall -q app.py converter.py pipeline tests benchmarks
      - name: Check Python dependency consistency
        run: python -m pip check
